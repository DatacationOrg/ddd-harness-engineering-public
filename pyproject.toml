[project]
name = "ddd-harness-engineering"
version = "2026.0.0"
description = ""
authors = [{ name = "Datacation", email = "info@datacation.nl" }]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.14.4",
    "deepagents>=0.6.12",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.4",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "mcp>=1.28.1",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "streamlit>=1.59.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddd_harness_engineering"]

[tool.uv]
# Frozen to a fixed instant (was a rolling "P7D" window) so that a re-lock during the
# workshop cannot shift dependency resolution under participants. Written as an explicit
# UTC timestamp rather than a bare date, because uv expands a bare date using the local
# timezone -- which would produce a different lockfile for participants in another zone.
# This instant is just after the newest distribution in uv.lock; bump it deliberately.
exclude-newer = "2026-07-18T00:00:00Z"

[tool.basedpyright]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
